name: globalremit_extended

services:
  api-gateway:
    image: nginx:1.27-alpine
    container_name: globalremit-api-gateway
    ports:
      - "8080:8080"
    volumes:
      - ./api-gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - pg-haproxy
      - prometheus
      - grafana
    networks:
      - globalremit-ha-net
      - globalremit-net

  postgres-primary:
    image: postgres:18
    container_name: globalremit-postgres-primary
    environment:
      POSTGRES_DB: globalremit
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: GlobalRemitPg2026!
      POSTGRES_REPLICATION_USER: repl_globalremit
      POSTGRES_REPLICATION_PASSWORD: GlobalRemitRepl2026!
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - hot_standby=on
      - -c
      - listen_addresses=*
    ports:
      - "56432:5432"
    volumes:
      - globalremit_pg_primary_data:/var/lib/postgresql
      - ../06_sql_ddl.sql:/docker-entrypoint-initdb.d/01_ddl.sql:ro
      - ../06_sql_seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
      - ./postgres-ha/01_create_replication_user.sh:/docker-entrypoint-initdb.d/03_create_replication_user.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d globalremit"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - globalremit-ha-net

  postgres-standby:
    image: postgres:18
    container_name: globalremit-postgres-standby
    environment:
      PGUSER: postgres
      PGPASSWORD: GlobalRemitPg2026!
      POSTGRES_REPLICATION_USER: repl_globalremit
      POSTGRES_REPLICATION_PASSWORD: GlobalRemitRepl2026!
      PRIMARY_HOST: globalremit-postgres-primary
      PRIMARY_PORT: 5432
    entrypoint: ["/bin/bash", "/scripts/standby-entrypoint.sh"]
    ports:
      - "56433:5432"
    volumes:
      - globalremit_pg_standby_data:/var/lib/postgresql
      - ./postgres-ha/standby-entrypoint.sh:/scripts/standby-entrypoint.sh:ro
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - globalremit-ha-net

  pg-haproxy:
    image: haproxy:3.0
    container_name: globalremit-pg-haproxy
    ports:
      - "55433:5432"
      - "8404:8404"
    volumes:
      - ./haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - postgres-primary
      - postgres-standby
    networks:
      - globalremit-ha-net

  db-tools:
    image: python:3.12-slim
    container_name: globalremit-db-tools
    working_dir: /workspace
    environment:
      GLOBALREMIT_PG_PASSWORD: GlobalRemitPg2026!
      PYTHONUNBUFFERED: "1"
    volumes:
      - ..:/workspace
    entrypoint: ["bash", "-lc", "sleep infinity"]
    networks:
      - globalremit-ha-net

  pg-backup:
    image: postgres:18
    container_name: globalremit-pg-backup
    environment:
      PGPASSWORD: GlobalRemitPg2026!
      PGHOST: globalremit-postgres-primary
      PGPORT: 5432
      PGDATABASE: globalremit
      PGUSER: postgres
    volumes:
      - ./backup:/backup
    entrypoint: ["bash", "-lc", "sleep infinity"]
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - globalremit-ha-net

  mongo-backup:
    image: mongo:8
    container_name: globalremit-mongo-backup
    volumes:
      - ./backup:/backup
    entrypoint: ["bash", "-lc", "sleep infinity"]
    networks:
      - globalremit-net

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: globalremit-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - globalremit-ha-net
      - globalremit-net

  grafana:
    image: grafana/grafana:11.3.0
    container_name: globalremit-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: GlobalRemitGrafana2026!
    ports:
      - "3000:3000"
    volumes:
      - globalremit_grafana_data:/var/lib/grafana
    networks:
      - globalremit-ha-net
      - globalremit-net

networks:
  globalremit-ha-net:
    name: globalremit-ha-net
  globalremit-net:
    external: true

volumes:
  globalremit_pg_primary_data:
  globalremit_pg_standby_data:
  globalremit_grafana_data:
