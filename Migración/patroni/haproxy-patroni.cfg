global
    log stdout format raw local0
    maxconn 512

defaults
    log global
    mode tcp
    option tcplog
    timeout connect 5s
    timeout client 1m
    timeout server 1m

listen stats
    bind *:8405
    mode http
    stats enable
    stats uri /
    stats refresh 5s

frontend patroni_postgres_write
    bind *:5432
    default_backend patroni_primary

backend patroni_primary
    option httpchk GET /primary
    http-check expect status 200
    default-server inter 2s fall 3 rise 2 on-marked-down shutdown-sessions
    server pg1 globalremit-patroni-pg1:5432 check port 8008
    server pg2 globalremit-patroni-pg2:5432 check port 8008
    server pg3 globalremit-patroni-pg3:5432 check port 8008
